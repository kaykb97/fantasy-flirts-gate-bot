name: One-time register /treasure for Fantasy Flirts

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/register-treasure-guild-once.yml"

permissions:
  contents: read

jobs:
  register:
    runs-on: ubuntu-latest
    steps:
      - name: Register or update only the Fantasy Flirts /treasure command
        env:
          WORKER_URL: https://flirtingway-help.kalynkb97.workers.dev
          SCHEDULER_SECRET: ${{ secrets.GATE_ALERTS_WORKER_SECRET }}
        run: |
          set -euo pipefail
          response_file=$(mktemp)
          status=$(curl --silent --show-error --output "$response_file" --write-out "%{http_code}" \
            --request POST "$WORKER_URL/register-treasure-guild" \
            --header "Authorization: Bearer $SCHEDULER_SECRET")
          echo "Guild /treasure registration returned HTTP $status"
          cat "$response_file"
          rm -f "$response_file"
          if [ "$status" != "200" ]; then
            echo "Guild /treasure registration failed"
            exit 1
          fi
