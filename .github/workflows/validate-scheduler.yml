name: Scheduler validation

on:
  pull_request:
    branches: [main]
    paths:
      - "bot.py"
      - "tests/**"
      - ".github/workflows/validate-scheduler.yml"
      - ".github/workflows/daily.yml"
      - ".github/workflows/register-gate-board-and-treasure-once.yml"
      - "README.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Check Python syntax
        run: python -m py_compile bot.py tests/test_scheduler.py
      - name: Run scheduler tests
        run: python -m unittest discover -s tests -v
