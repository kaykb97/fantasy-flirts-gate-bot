name: Flirtingway GATE Scheduler

on:
  workflow_dispatch:
    inputs:
      force_post:
        description: "Post immediately instead of waiting for the next two-hour deadline"
        required: false
        type: boolean
        default: false
  schedule:
    # Retry check every 15 minutes; bot.py posts only when its two-hour deadline is due.
    - cron: "7,22,37,52 * * * *"

permissions:
  contents: write

concurrency:
  group: flirtingways-gate-scheduler
  cancel-in-progress: false

jobs:
  check-and-post:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check whether a new GATE post is due
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          FORCE_POST: ${{ inputs.force_post }}
        run: python bot.py
