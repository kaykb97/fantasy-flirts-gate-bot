name: Flirtingway GATE Scheduler

on:
  workflow_dispatch:
    inputs:
      force_post:
        description: "Post immediately instead of waiting for the next 15-minute Eastern clock time"
        required: false
        type: boolean
        default: false
  schedule:
    # Run at each quarter-hour; bot.py posts at each 15-minute Eastern clock boundary.
    - cron: "0,15,30,45 * * * *"

permissions:
  contents: write

concurrency:
  group: flirtingways-gate-scheduler
  cancel-in-progress: false

jobs:
  check-and-post:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check Python syntax
        run: python -m py_compile bot.py

      - name: Check whether the next 15-minute Eastern board post is due
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          FORCE_POST: ${{ inputs.force_post }}
          GATE_ALERT_ROLE_IDS: ${{ secrets.GATE_ALERT_ROLE_IDS }}
        run: python bot.py
