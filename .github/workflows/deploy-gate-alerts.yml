name: Deploy Flirtingway DM Alerts Worker

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Wrangler
        run: npm install --global wrangler@4

      - name: Check Worker JavaScript syntax
        working-directory: worker
        run: node --input-type=module --check < src/index.js

      - name: Apply D1 migrations
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 5077ce842048bd36ba915d4105603177
        run: wrangler d1 migrations apply flirtingway-gate-alerts --remote

      - name: Deploy Worker
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 5077ce842048bd36ba915d4105603177
        run: wrangler deploy

      - name: Register Discord server command
        env:
          GATE_ALERTS_WORKER_URL: ${{ secrets.GATE_ALERTS_WORKER_URL }}
          GATE_ALERTS_WORKER_SECRET: ${{ secrets.GATE_ALERTS_WORKER_SECRET }}
        run: |
          test -n "$GATE_ALERTS_WORKER_URL"
          test -n "$GATE_ALERTS_WORKER_SECRET"
          curl --fail-with-body --silent --show-error \
            -X POST "$GATE_ALERTS_WORKER_URL/register" \
            -H "Authorization: Bearer $GATE_ALERTS_WORKER_SECRET"
